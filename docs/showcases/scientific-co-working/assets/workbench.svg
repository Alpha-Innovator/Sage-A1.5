<svg xmlns="http://www.w3.org/2000/svg" viewBox="340 70 460 360" fill="none">
  <title>A professional workbench: run tools, build artifacts, verify the result</title>
  <desc>An integrated tool console with chip routing and flow analysis, delivering checked native files.</desc>
  <defs>
    <linearGradient id="workbench-face" x1="403" y1="101" x2="731" y2="359" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e8f0f3"/></linearGradient>
    <linearGradient id="workbench-surface" x1="397" y1="370" x2="747" y2="411" gradientUnits="userSpaceOnUse"><stop stop-color="#dce9ee"/><stop offset="1" stop-color="#eff4f7"/></linearGradient>
  </defs>
  <!-- One rectangular engineering workstation, with a continuous execution path. -->
  <path d="M405 361h324l31 40H374z" fill="url(#workbench-surface)" stroke="#8aa6b4" stroke-width="1.6"/>
  <path d="M374 401v9h386v-9" fill="#e2edf1" stroke="#8aa6b4" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="410" y="104" width="327" height="263" rx="12" fill="#dfeaf0" stroke="#7797aa" stroke-opacity=".4" stroke-width="1.6"/>
  <rect x="400" y="94" width="327" height="263" rx="12" fill="url(#workbench-face)" stroke="#658b9e" stroke-width="2"/>
  <path d="M401 130h325" stroke="#8ca8b7" stroke-opacity=".65"/>
  <g fill="#85a4b4"><circle cx="418" cy="112" r="3"/><circle cx="431" cy="112" r="3"/><circle cx="444" cy="112" r="3"/></g>
  <path d="M674 112h34" stroke="#6f93a6" stroke-width="3" stroke-linecap="round"/>
