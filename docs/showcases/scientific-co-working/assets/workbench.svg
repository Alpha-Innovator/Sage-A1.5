  <rect x="413" y="143" width="83" height="198" rx="5" fill="#e4eef2"/>
  <g stroke="#527e93" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m429 160 11 9-11 9m19 0h14"/>
    <path d="M430 202h43m-43 11h29M430 241h43m-43 11h32M430 280h43m-43 11h26" stroke="#8ca9b6" stroke-width="2"/>
  </g>
  <g stroke="#6b978f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m430 319 4 4 8-9m10 5 4 4 8-9m10 5 4 4 8-9"/></g>
  <!-- Native engineering work: routed cells above a flow profile. -->
  <rect x="508" y="143" width="205" height="115" rx="5" fill="#f2f7f9" stroke="#9ab3bf" stroke-opacity=".6"/>
  <g stroke="#749bab" stroke-width="1.7" stroke-linejoin="round">
    <path d="M529 162h25v16h29m-54 58h31v-18h23m61-40h27v-16h21m-48 56h18v17h30"/>
    <path d="M595 161v13m15-13v13m15-13v13m-30 49v17m15-17v17m15-17v17M566 190h15m-15 15h15m63-15h17m-17 15h17"/>
    <rect x="582" y="175" width="61" height="48" rx="3" fill="#dce9ef" stroke="#557f94" stroke-width="2"/>
    <path d="M592 188h16v11h25m-41 14h28v-24m-14 34v-10" stroke="#5a8d92" stroke-width="2.1"/>
  </g>
  <g fill="#7a9fba"><circle cx="529" cy="162" r="3"/><circle cx="529" cy="236" r="3"/><circle cx="692" cy="162" r="3"/><circle cx="692" cy="235" r="3"/></g>
  <rect x="508" y="269" width="205" height="72" rx="5" fill="#f2f7f9" stroke="#9ab3bf" stroke-opacity=".6"/>
  <g stroke="#709aa9" stroke-width="1.6" stroke-linecap="round">
    <path d="M521 283c43 0 49 13 85 11s55-8 93-8M521 297c27 0 42 11 79 8s68-5 99-5M521 317c39 0 49-11 84-7s58 11 94 11M521 330c41 0 49-11 84-8s61 11 94 11" stroke-opacity=".55"/>
